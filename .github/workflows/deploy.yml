name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Actions 把构建产物发布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 把仓库名作为子路径注入 base（GitHub Pages 项目页位于 /<仓库名>/）
        # 若仓库命名为 <用户名>.github.io（用户页，部署在根路径），改成 --base=/
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # enablement: true 仅在 Pages 站点已存在时才安全通过；
          # 若站点尚未创建，GITHUB_TOKEN 无权调用「创建 Pages 站点」接口，
          # 会报 Resource not accessible by integration。
          # => 首次上线必须先手动在 Settings → Pages 把 Source 选为 GitHub Actions
          #    （或用有 repo 权限的 token 调一次 POST /repos/{owner}/{repo}/pages，
          #      body: {"build_type":"workflow"}），之后本步骤即可正常通过。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
